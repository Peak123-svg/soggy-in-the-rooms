<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soggy Cat In The Rooms</title>
    <style>
        body {
            margin: 0;
            background-color: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border: 3px solid #222;
            border-radius: 6px;
        }
        canvas {
            background: #151515;
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 450px;
            background: rgba(5, 5, 5, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }
        h1 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-size: 28px;
        }
        p {
            color: #aaaaaa;
            max-width: 500px;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 400;
        }
        .btn {
            background-color: #ffffff;
            color: black;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #d1d1d1;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            z-index: 5;
        }
        .stamina-container {
            width: 140px;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            overflow: hidden;
        }
        #stamina-fill {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <h1>SOGGY CAT IN THE ROOMS</h1>
        <p>help sog cat navigate through rooms Use wasd to move, shift to run, space to jump, press e at lockers to hide, and press e at doors to progress</p>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff5555;">YOU DIED</h1>
        <p id="death-reason">one of the evil sogs caughted u.</p>
        <button class="btn" onclick="resetGame()">TRY AGAIN</button>
    </div>

    <!-- HUD Elements -->
    <div id="ui-layer">
        <div id="room-counter">Room: A-001</div>
        <div>Stamina <div class="stamina-container"><div id="stamina-fill"></div></div></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Load Soggy Cat Sprite from GitHub raw URL
    const soggyImg = new Image();
    soggyImg.crossOrigin = "anonymous";
    soggyImg.src = "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/soggy-removebg-preview.png";

    // Door open sound effect
    const doorSound = new Audio("https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/door_open.ogg");
    doorSound.volume = 0.6;

    // Game States
    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER

    // Player Object with Jump Physics
    let player = {
        x: 100,
        y: 280,
        width: 40,
        height: 50,
        speed: 3.5,
        runSpeed: 6.5,
        vy: 0,
        gravity: 0.6,
        jumpPower: -10.5,
        isGrounded: true,
        stamina: 100,
        maxStamina: 100,
        isHiding: false
    };

    // Game World Variables (Infinite Rooms)
    let currentRoomIndex = 1;
    let cameraX = 0;
    let roomLength = 700;  
    
    let roomsData = [];
    let hidingSpots = [];
    let doors = [];

    // Controls tracking
    let keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ' && !keys['space_locked']) {
            keys['space_locked'] = true;
            if (gameState === "PLAYING" && player.isGrounded && !player.isHiding) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }
        }
        if (e.key.toLowerCase() === 'e' && gameState === "PLAYING") {
            tryInteractAction();
        }
    });
    window.addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false;
        if (e.key === ' ') {
            keys['space_locked'] = false;
        }
    });

    // ==========================================
    // CUSTOMIZABLE ENTITIES
    // ==========================================
    let entitiesConfig = [
        {
            name: "angry sog",
            type: "rusher",
            speed: 12,
            spawnChance: 0.003,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/angy.jpg", 
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/Meow.wav"
        },
        {
            name: "evil sog",
            type: "rebounder",
            speed: 8,
            spawnChance: 0.001,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/soggy%20cat%20evil.webp",
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/Artful's%20Copyright%20Music%20Box%20(UNOFFICIAL%20UPLOAD).mp3"
        }
    ];

    entitiesConfig.forEach(config => {
        if (config.imageUrl) {
            let img = new Image();
            img.crossOrigin = "anonymous";
            img.src = config.imageUrl;
            config.loadedImage = img;
        }
        if (config.audioUrl) {
            config.sound = new Audio(config.audioUrl);
            config.sound.volume = 0.6;
        }
    });

    let activeEntity = null;

    function generateInitialRooms() {
        roomsData = [];
        hidingSpots = [];
        doors = [];
        for (let i = 1; i <= 5; i++) {
            createRoomSegment(i);
        }
    }

    function createRoomSegment(index) {
        let rx = (index - 1) * roomLength;
        roomsData.push({ index: index, x: rx, isRed: index % 2 === 0 });

        // Add 2 Lockers per room
        hidingSpots.push({ x: rx + 220, highlighted: false });
        hidingSpots.push({ x: rx + 480, highlighted: false });

        // Add a locked door at the end of the room
        doors.push({ x: rx + roomLength - 40, roomIndex: index, highlighted: false });
    }

    function startGame() {
        document.getElementById("menu-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function resetGameVars() {
        player.x = 100;
        player.y = 280;
        player.vy = 0;
        player.isGrounded = true;
        player.stamina = 100;
        player.isHiding = false;
        currentRoomIndex = 1;
        cameraX = 0;
        activeEntity = null;
        generateInitialRooms();
    }

    function resetGame() {
        document.getElementById("gameover-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function triggerGameOver(reason) {
        gameState = "GAMEOVER";
        document.getElementById("death-reason").innerText = reason;
        document.getElementById("gameover-screen").style.display = "flex";
    }

    function tryInteractAction() {
        // Check lockers first
        for (let spot of hidingSpots) {
            if (Math.abs(player.x - spot.x) < 55 && player.isGrounded) {
                player.isHiding = !player.isHiding;
                if (player.isHiding) {
                    player.x = spot.x; 
                    player.vy = 0;
                }
                return;
            }
        }

        // Check doors next (Strict room progression)
        for (let door of doors) {
            if (Math.abs(player.x - door.x) < 55) {
                doorSound.currentTime = 0;
                doorSound.play().catch(e => {});
                
                // Advance player through door into next room
                player.x += 90;
                currentRoomIndex = door.roomIndex + 1;

                // Infinite generation ahead
                if (currentRoomIndex + 2 > roomsData.length) {
                    createRoomSegment(roomsData.length + 1);
                }
                return;
            }
        }
    }

    // Main Update Loop
    function update() {
        if (gameState !== "PLAYING") return;

        // --- STAMINA & MOVEMENT LOGIC ---
        let isRunning = keys['shift'] && player.stamina > 0 && (keys['a'] || keys['d']) && !player.isHiding;
        let currentSpeed = isRunning ? player.runSpeed : player.speed;

        if (isRunning) {
            player.stamina = Math.max(0, player.stamina - 0.8);
        } else if (!keys['shift'] && player.stamina < player.maxStamina) {
            player.stamina = Math.min(player.maxStamina, player.stamina + 0.4);
        }
        document.getElementById("stamina-fill").style.width = player.stamina + "%";

        if (!player.isHiding) {
            if (keys['a'] || keys['arrowleft']) {
                player.x -= currentSpeed;
            }
            if (keys['d'] || keys['arrowright']) {
                player.x += currentSpeed;
            }

            // Apply Gravity & Jump Physics
            player.vy += player.gravity;
            player.y += player.vy;

            // Ground collision
            if (player.y >= 280) {
                player.y = 280;
                player.vy = 0;
                player.isGrounded = true;
            }
        }

        // --- STRICT ROOM BOUNDARY CHECK ---
        let currentDoor = doors.find(d => d.roomIndex === currentRoomIndex);
        if (currentDoor && !player.isHiding) {
            let maxAllowedX = currentDoor.x - 15;
            if (player.x > maxAllowedX) {
                player.x = maxAllowedX;
            }
        }

        player.x = Math.max(25, player.x);

        // Smooth Camera Follow Player
        let targetCameraX = player.x - canvas.width / 2;
        cameraX += (targetCameraX - cameraX) * 0.1;

        // --- HIGHLIGHT PROXIMITY CHECKS ---
        for (let spot of hidingSpots) {
            spot.highlighted = Math.abs(player.x - spot.x) < 55 && player.isGrounded;
        }
        for (let door of doors) {
            door.highlighted = Math.abs(player.x - door.x) < 55;
        }

        // --- ENTITY SPAWN & AUDIO/AI LOGIC ---
        if (!activeEntity && Math.random() < 0.004 && currentRoomIndex > 2) {
            let template = entitiesConfig[Math.floor(Math.random() * entitiesConfig.length)];
            
            activeEntity = {
                name: template.name,
                type: template.type,
                speed: template.speed,
                image: template.loadedImage,
                x: cameraX + canvas.width + 100,
                state: "warning", 
                timer: 90 
            };

            if (template.sound) {
                template.sound.currentTime = 0;
                template.sound.play().catch(err => {});
            }
        }

        if (activeEntity) {
            if (activeEntity.state === "warning") {
                activeEntity.timer--;
                if (activeEntity.timer <= 0) {
                    activeEntity.state = "charging";
                }
            } else if (activeEntity.state === "charging") {
                activeEntity.x -= activeEntity.speed;

                // Collision detection checks horizontal proximity (jumping won't save you)
                if (Math.abs(player.x - activeEntity.x) < 45) {
                    if (!player.isHiding) {
                        triggerGameOver(`Killed by ${activeEntity.name}. You didn't hide in time!`);
                    }
                }

                if (activeEntity.x < cameraX - 100) {
                    activeEntity = null;
                }
            }
        }
    }

    // Main Render Loop
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        // --- DRAW INFINITE ROOMS WITH POLISHED DEPTH ---
        for (let room of roomsData) {
            let rx = room.x;

            let wallGrad = ctx.createLinearGradient(rx, 50, rx, 330);
            wallGrad.addColorStop(0, "#163820");
            wallGrad.addColorStop(1, "#1e4d2b");
            ctx.fillStyle = wallGrad;
            ctx.fillRect(rx, 50, roomLength, 280);
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
            ctx.fillRect(rx, 50, roomLength, 20);

            let floorGrad = ctx.createLinearGradient(rx, 330, rx, 400);
            if (room.isRed) {
                floorGrad.addColorStop(0, "#7a1a1a");
                floorGrad.addColorStop(1, "#521111");
            } else {
                floorGrad.addColorStop(0, "#1a357a");
                floorGrad.addColorStop(1, "#112252");
            }
            ctx.fillStyle = floorGrad;
            ctx.fillRect(rx, 330, roomLength, 70);
            
            ctx.fillStyle = "#261708"; 
            ctx.fillRect(rx, 322, roomLength, 8);
            ctx.fillStyle = "#150d04";
            ctx.fillRect(rx, 329, roomLength, 2);

            ctx.strokeStyle = "#051208";
            ctx.lineWidth = 6;
            ctx.strokeRect(rx, 50, roomLength, 350);

            ctx.fillStyle = "#88ff88";
            ctx.font = "bold 14px Arial";
            ctx.fillText(`A-${String(room.index).padStart(3, '0')}`, rx + 50, 95);
        }

        // --- DRAW INSANELY GOOD DOORS ---
        for (let door of doors) {
            ctx.fillStyle = "#0c0602";
            ctx.fillRect(door.x - 24, 146, 48, 188);

            let doorGrad = ctx.createLinearGradient(door.x - 20, 150, door.x + 20, 330);
            doorGrad.addColorStop(0, "#593619");
            doorGrad.addColorStop(0.5, "#42250f");
            doorGrad.addColorStop(1, "#2b1708");
            ctx.fillStyle = doorGrad;
            ctx.fillRect(door.x - 20, 150, 40, 180);

            ctx.strokeStyle = "#1a0d04";
            ctx.lineWidth = 3;
            ctx.strokeRect(door.x - 15, 165, 30, 70);
            ctx.strokeRect(door.x - 15, 245, 30, 70);

            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.arc(door.x + 10, 240, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#b39700";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(door.x + 8, 238, 2, 2);

            if (door.highlighted) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(door.x - 27, 142, 54, 196);

                ctx.fillStyle = "white";
                ctx.fillRect(door.x - 38, 108, 76, 26);
                ctx.fillStyle = "black";
                ctx.font = "bold 11px Arial";
                ctx.fillText("OPEN", door.x - 20, 125);
            }
        }

        // --- DRAW INSANELY GOOD LOCKERS ---
        for (let spot of hidingSpots) {
            ctx.fillStyle = "#151c24";
            ctx.fillRect(spot.x - 24, 208, 48, 124);

            let lockerGrad = ctx.createLinearGradient(spot.x - 22, 210, spot.x + 22, 330);
            lockerGrad.addColorStop(0, "#4a5d70");
            lockerGrad.addColorStop(0.5, "#34424f");
            lockerGrad.addColorStop(1, "#222c36");
            ctx.fillStyle = lockerGrad;
            ctx.fillRect(spot.x - 22, 210, 44, 120);

            ctx.strokeStyle = "#182129";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(spot.x, 210);
            ctx.lineTo(spot.x, 330);
            ctx.stroke();

            ctx.fillStyle = "#182129";
            for (let v = 0; v < 4; v++) {
                ctx.fillRect(spot.x - 14, 226 + (v * 7), 8, 3);
                ctx.fillRect(spot.x + 6, 226 + (v * 7), 8, 3);
            }

            ctx.fillStyle = "#d1d5db";
            ctx.fillRect(spot.x - 6, 265, 3, 25);
            ctx.fillStyle = "#9ca3af";
            ctx.fillRect(spot.x - 6, 265, 1, 25);

            if (spot.highlighted && !player.isHiding) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(spot.x - 27, 204, 54, 132);

                ctx.fillStyle = "white";
                ctx.fillRect(spot.x - 38, 172, 76, 26);
                ctx.fillStyle = "black";
                ctx.font = "bold 11px Arial";
                ctx.fillText("HIDE", spot.x - 18, 189);
            }
        }

        // --- DRAW PLAYER (SOGGY CAT - NO OUTLINE) ---
        if (!player.isHiding) {
            if (soggyImg.complete && soggyImg.naturalHeight !== 0) {
                ctx.drawImage(soggyImg, player.x - player.width / 2, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(player.x - player.width / 2, player.y, player.width, player.height);
            }
        }

        // --- DRAW ACTIVE ENTITY ---
        if (activeEntity && activeEntity.state === "charging") {
            if (activeEntity.image && activeEntity.image.complete && activeEntity.image.naturalHeight !== 0) {
                ctx.drawImage(activeEntity.image, activeEntity.x - 35, player.y - 15, 70, 70);
            } else {
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(activeEntity.x - 25, player.y, 50, 50);
            }
        }

        ctx.restore();
    }

    // Engine Loop
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
