<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soggy Cat In The Rooms</title>
    <style>
        body {
            margin: 0;
            background-color: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border: 3px solid #222;
            border-radius: 0; /* Simplistic UI */
        }
        canvas {
            background: #151515;
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 450px;
            background: rgba(5, 5, 5, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            border-radius: 0;
        }
        h1 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-size: 28px;
        }
        p {
            color: #aaaaaa;
            max-width: 500px;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 400;
        }
        .btn {
            background-color: #ffffff;
            color: black;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
            border-radius: 0; /* Simplistic UI */
        }
        .btn:hover {
            background-color: #d1d1d1;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            z-index: 5;
        }
        .stamina-container {
            width: 140px;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 0; /* Simplistic UI */
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            overflow: hidden;
        }
        #stamina-fill {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            transition: width 0.1s linear;
        }
        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 450px;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 8;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="transition-overlay"></div>
    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <h1>SOGGY CAT IN THE ROOMS</h1>
        <p>help sog cat navigate through rooms. Use wasd to move, shift to run, space to jump, press e at lockers to hide, and press e at doors to progress</p>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff5555;">YOU DIED</h1>
        <p id="death-reason">one of the evil sogs caughted u.</p>
        <button class="btn" onclick="resetGame()">TRY AGAIN</button>
    </div>

    <!-- HUD Elements -->
    <div id="ui-layer">
        <div id="room-counter">Room: A-001</div>
        <div>Stamina <div class="stamina-container"><div id="stamina-fill"></div></div></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const soggyImg = new Image();
    soggyImg.crossOrigin = "anonymous";
    soggyImg.src = "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/soggy-removebg-preview.png";

    const doorSound = new Audio("https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/door_open.ogg");
    doorSound.volume = 0.6;

    let gameState = "MENU"; 

    let player = {
        x: 100,
        y: 280,
        width: 40,
        height: 50,
        speed: 3.5,
        runSpeed: 6.5,
        vy: 0,
        gravity: 0.6,
        jumpPower: -10.5,
        isGrounded: true,
        stamina: 100,
        maxStamina: 100,
        isHiding: false
    };

    let currentRoomIndex = 1;
    let cameraX = 0;
    let roomLength = 700;  
    
    let roomsData = [];
    let hidingSpots = [];
    let doors = [];
    let activeEntities = [];

    let keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ' && !keys['space_locked']) {
            keys['space_locked'] = true;
            if (gameState === "PLAYING" && player.isGrounded && !player.isHiding) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }
        }
        if (e.key.toLowerCase() === 'e' && gameState === "PLAYING") {
            tryInteractAction();
        }
    });
    window.addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false;
        if (e.key === ' ') {
            keys['space_locked'] = false;
        }
    });

    let entitiesConfig = [
        {
            name: "angry sog",
            type: "rusher",
            speed: 12,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/angy.jpg", 
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/Meow.wav"
        },
        {
            name: "evil sog",
            type: "rebounder",
            speed: 7,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/soggy%20cat%20evil.webp",
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/Artful's%20Copyright%20Music%20Box%20(UNOFFICIAL%20UPLOAD).mp3"
        }
    ];

    entitiesConfig.forEach(config => {
        if (config.imageUrl) {
            let img = new Image();
            img.crossOrigin = "anonymous";
            img.src = config.imageUrl;
            config.loadedImage = img;
        }
        if (config.audioUrl) {
            config.sound = new Audio(config.audioUrl);
            config.sound.volume = 0.6;
            config.sound.loop = (config.type === "rebounder"); // Loop ambience if rebounder
        }
    });

    function generateInitialRooms() {
        roomsData = [];
        hidingSpots = [];
        doors = [];
        for (let i = 1; i <= 5; i++) {
            createRoomSegment(i);
        }
    }

    function createRoomSegment(index) {
        let rx = (index - 1) * roomLength;
        
        // Varied room themes & props
        let decorType = index % 3; 
        roomsData.push({ 
            index: index, 
            x: rx, 
            decor: decorType,
            tint: index % 2 === 0 ? "red" : "blue" 
        });

        hidingSpots.push({ x: rx + 220, highlighted: false });
        hidingSpots.push({ x: rx + 480, highlighted: false });

        doors.push({ x: rx + roomLength - 40, roomIndex: index, highlighted: false });
    }

    function startGame() {
        document.getElementById("menu-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function resetGameVars() {
        player.x = 100;
        player.y = 280;
        player.vy = 0;
        player.isGrounded = true;
        player.stamina = 100;
        player.isHiding = false;
        currentRoomIndex = 1;
        cameraX = 0;
        
        // Stop all entity audio
        entitiesConfig.forEach(c => {
            if (c.sound) {
                c.sound.pause();
                c.sound.currentTime = 0;
            }
        });
        activeEntities = [];
        generateInitialRooms();
    }

    function resetGame() {
        document.getElementById("gameover-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function triggerGameOver(reason) {
        gameState = "GAMEOVER";
        entitiesConfig.forEach(c => {
            if (c.sound) {
                c.sound.pause();
                c.sound.currentTime = 0;
            }
        });
        document.getElementById("death-reason").innerText = reason;
        document.getElementById("gameover-screen").style.display = "flex";
    }

    function tryInteractAction() {
        for (let spot of hidingSpots) {
            if (Math.abs(player.x - spot.x) < 55 && player.isGrounded) {
                player.isHiding = !player.isHiding;
                if (player.isHiding) {
                    player.x = spot.x; 
                    player.vy = 0;
                }
                return;
            }
        }

        for (let door of doors) {
            if (Math.abs(player.x - door.x) < 55) {
                doorSound.currentTime = 0;
                doorSound.play().catch(e => {});
                
                // Door Transition Effect
                let overlay = document.getElementById("transition-overlay");
                overlay.style.opacity = "1";

                setTimeout(() => {
                    player.x += 90;
                    currentRoomIndex = door.roomIndex + 1;
                    document.getElementById("room-counter").innerText = `Room: A-${String(currentRoomIndex).padStart(3, '0')}`;

                    if (currentRoomIndex + 2 > roomsData.length) {
                        createRoomSegment(roomsData.length + 1);
                    }

                    // Chance to trigger entity spawn upon opening a door
                    if (Math.random() < 0.65 && currentRoomIndex > 2) {
                        spawnEntity();
                    }

                    overlay.style.opacity = "0";
                }, 200);

                return;
            }
        }
    }

    function spawnEntity() {
        let template = entitiesConfig[Math.floor(Math.random() * entitiesConfig.length)];
        
        let newEntity = {
            name: template.name,
            type: template.type,
            speed: template.speed,
            image: template.loadedImage,
            x: cameraX + canvas.width + 100,
            state: "warning", 
            timer: 70,
            sound: template.sound,
            bouncesLeft: template.type === "rebounder" ? 2 : 0
        };

        activeEntities.push(newEntity);

        if (template.sound) {
            template.sound.currentTime = 0;
            template.sound.play().catch(err => {});
        }
    }

    function update() {
        if (gameState !== "PLAYING") return;

        let isRunning = keys['shift'] && player.stamina > 0 && (keys['a'] || keys['d']) && !player.isHiding;
        let currentSpeed = isRunning ? player.runSpeed : player.speed;

        if (isRunning) {
            player.stamina = Math.max(0, player.stamina - 0.8);
        } else if (!keys['shift'] && player.stamina < player.maxStamina) {
            player.stamina = Math.min(player.maxStamina, player.stamina + 0.4);
        }
        document.getElementById("stamina-fill").style.width = player.stamina + "%";

        if (!player.isHiding) {
            if (keys['a'] || keys['arrowleft']) {
                player.x -= currentSpeed;
            }
            if (keys['d'] || keys['arrowright']) {
                player.x += currentSpeed;
            }

            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= 280) {
                player.y = 280;
                player.vy = 0;
                player.isGrounded = true;
            }
        }

        let currentDoor = doors.find(d => d.roomIndex === currentRoomIndex);
        if (currentDoor && !player.isHiding) {
            let maxAllowedX = currentDoor.x - 15;
            if (player.x > maxAllowedX) {
                player.x = maxAllowedX;
            }
        }

        player.x = Math.max(25, player.x);

        let targetCameraX = player.x - canvas.width / 2;
        cameraX += (targetCameraX - cameraX) * 0.1;

        for (let spot of hidingSpots) {
            spot.highlighted = Math.abs(player.x - spot.x) < 55 && player.isGrounded;
        }
        for (let door of doors) {
            door.highlighted = Math.abs(player.x - door.x) < 55;
        }

        // Entity Logic Updates
        for (let i = activeEntities.length - 1; i >= 0; i--) {
            let ent = activeEntities[i];
            if (ent.state === "warning") {
                ent.timer--;
                if (ent.timer <= 0) {
                    ent.state = "charging";
                }
            } else if (ent.state === "charging") {
                ent.x -= ent.speed;

                if (Math.abs(player.x - ent.x) < 45) {
                    if (!player.isHiding) {
                        triggerGameOver(`Killed by ${ent.name}. You didn't hide in time!`);
                    }
                }

                // Handle Rebounder Logic
                if (ent.type === "rebounder" && ent.x < cameraX - 150) {
                    if (ent.bouncesLeft > 0) {
                        ent.bouncesLeft--;
                        ent.speed *= -1; // Rebound back across!
                    } else {
                        if (ent.sound) ent.sound.pause();
                        activeEntities.splice(i, 1);
                        continue;
                    }
                }

                if (ent.x < cameraX - 200 || ent.x > cameraX + canvas.width + 300) {
                    if (ent.sound) ent.sound.pause();
                    activeEntities.splice(i, 1);
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        // --- DRAW ROOMS WITH VARIETY ---
        for (let room of roomsData) {
            let rx = room.x;

            let wallGrad = ctx.createLinearGradient(rx, 50, rx, 330);
            if (room.tint === "red") {
                wallGrad.addColorStop(0, "#381616");
                wallGrad.addColorStop(1, "#4d1e1e");
            } else {
                wallGrad.addColorStop(0, "#162838");
                wallGrad.addColorStop(1, "#1e374d");
            }
            ctx.fillStyle = wallGrad;
            ctx.fillRect(rx, 50, roomLength, 280);
            
            // Wall Props Variety
            if (room.decor === 1) {
                ctx.fillStyle = "rgba(255,255,255,0.05)";
                ctx.fillRect(rx + 150, 120, 80, 100);
                ctx.fillRect(rx + 450, 120, 80, 100);
            } else if (room.decor === 2) {
                ctx.fillStyle = "rgba(0,0,0,0.2)";
                ctx.fillRect(rx + 320, 50, 60, 280);
            }

            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
            ctx.fillRect(rx, 50, roomLength, 20);

            let floorGrad = ctx.createLinearGradient(rx, 330, rx, 400);
            if (room.tint === "red") {
                floorGrad.addColorStop(0, "#7a1a1a");
                floorGrad.addColorStop(1, "#521111");
            } else {
                floorGrad.addColorStop(0, "#1a357a");
                floorGrad.addColorStop(1, "#112252");
            }
            ctx.fillStyle = floorGrad;
            ctx.fillRect(rx, 330, roomLength, 70);
            
            ctx.fillStyle = "#261708"; 
            ctx.fillRect(rx, 322, roomLength, 8);

            ctx.strokeStyle = "#051208";
            ctx.lineWidth = 6;
            ctx.strokeRect(rx, 50, roomLength, 350);

            ctx.fillStyle = "#88ff88";
            ctx.font = "bold 14px Arial";
            ctx.fillText(`A-${String(room.index).padStart(3, '0')}`, rx + 50, 95);
        }

        // --- DRAW DOORS ---
        for (let door of doors) {
            ctx.fillStyle = "#0c0602";
            ctx.fillRect(door.x - 24, 146, 48, 188);

            let doorGrad = ctx.createLinearGradient(door.x - 20, 150, door.x + 20, 330);
            doorGrad.addColorStop(0, "#593619");
            doorGrad.addColorStop(1, "#2b1708");
            ctx.fillStyle = doorGrad;
            ctx.fillRect(door.x - 20, 150, 40, 180);

            if (door.highlighted) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(door.x - 27, 142, 54, 196);

                ctx.fillStyle = "white";
                ctx.fillRect(door.x - 38, 108, 76, 26);
                ctx.fillStyle = "black";
                ctx.font = "bold 11px Arial";
                ctx.fillText("OPEN", door.x - 20, 125);
            }
        }

        // --- DRAW LOCKERS ---
        for (let spot of hidingSpots) {
            let lockerGrad = ctx.createLinearGradient(spot.x - 22, 210, spot.x + 22, 330);
            lockerGrad.addColorStop(0, "#4a5d70");
            lockerGrad.addColorStop(1, "#222c36");
            ctx.fillStyle = lockerGrad;
            ctx.fillRect(spot.x - 22, 210, 44, 120);

            if (spot.highlighted && !player.isHiding) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(spot.x - 27, 204, 54, 132);

                ctx.fillStyle = "white";
                ctx.fillRect(spot.x - 38, 172, 76, 26);
                ctx.fillStyle = "black";
                ctx.font = "bold 11px Arial";
                ctx.fillText("HIDE", spot.x - 18, 189);
            }
        }

        // --- DRAW PLAYER ---
        if (!player.isHiding) {
            if (soggyImg.complete && soggyImg.naturalHeight !== 0) {
                ctx.drawImage(soggyImg, player.x - player.width / 2, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(player.x - player.width / 2, player.y, player.width, player.height);
            }
        }

        // --- DRAW ACTIVE ENTITIES ---
        for (let ent of activeEntities) {
            if (ent.state === "charging") {
                if (ent.image && ent.image.complete && ent.image.naturalHeight !== 0) {
                    ctx.drawImage(ent.image, ent.x - 35, player.y - 15, 70, 70);
                } else {
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(ent.x - 25, player.y, 50, 50);
                }
            }
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
