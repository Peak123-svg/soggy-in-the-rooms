<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soggy Cat In The Rooms</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            background: #222;
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 450px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }
        h1 {
            color: #55ff55;
            text-shadow: 2px 2px #000;
            margin-bottom: 10px;
        }
        p {
            color: #ccc;
            max-width: 500px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            background-color: #333;
            color: white;
            border: 2px solid #55ff55;
            padding: 10px 20px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #55ff55;
            color: black;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px #000;
            z-index: 5;
        }
        .stamina-container {
            width: 150px;
            height: 15px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }
        #stamina-fill {
            width: 100%;
            height: 100%;
            background-color: #ffff00;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <h1>SOGGY CAT IN THE ROOMS</h1>
        <p>Guide Soggy Cat through infinite rooms. Use WASD to move, <b>Shift</b> to run, press <b>E</b> at lockers/tables to hide, and press <b>E</b> at doors to enter!</p>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff4444;">YOU DIED</h1>
        <p id="death-reason">An entity got you.</p>
        <button class="btn" onclick="resetGame()">TRY AGAIN</button>
    </div>

    <!-- HUD Elements -->
    <div id="ui-layer">
        <div id="room-counter">Room: A-001</div>
        <div>Stamina: <div class="stamina-container"><div id="stamina-fill"></div></div></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Load Soggy Cat Sprite from GitHub raw URL
    const soggyImg = new Image();
    soggyImg.crossOrigin = "anonymous";
    soggyImg.src = "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/soggy-removebg-preview.png";

    // Sound effect for opening doors
    const doorSound = new Audio("https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/door_open.ogg");
    doorSound.volume = 0.9;

    // Game States
    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER, TRANSITIONING

    // Player Object
    let player = {
        x: 100,
        y: 300,
        width: 40,
        height: 50,
        speed: 3,
        runSpeed: 6,
        stamina: 100,
        maxStamina: 100,
        isHiding: false
    };

    // Game World Variables (Infinite Rooms)
    let currentRoomIndex = 1;
    let cameraX = 0;
    let roomLength = 700;  
    
    // Dynamic lists for infinite generation
    let roomsData = [];
    let hidingSpots = [];
    let doors = [];

    // Controls tracking
    let keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key.toLowerCase() === 'e' && gameState === "PLAYING") {
            tryInteractAction();
        }
    });
    window.addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    // ==========================================
    // CUSTOMIZABLE ENTITIES
    // ==========================================
    let entitiesConfig = [
        {
            name: "Rusher-A",
            type: "rusher",
            speed: 12,
            spawnChance: 0.003,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/rusher.png", 
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/rusher_audio.mp3"
        },
        {
            name: "Rebounder-B",
            type: "rebounder",
            speed: 8,
            spawnChance: 0.001,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/rebounder.png",
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/rebounder_audio.mp3"
        }
    ];

    entitiesConfig.forEach(config => {
        if (config.imageUrl) {
            let img = new Image();
            img.crossOrigin = "anonymous";
            img.src = config.imageUrl;
            config.loadedImage = img;
        }
        if (config.audioUrl) {
            config.sound = new Audio(config.audioUrl);
            config.sound.volume = 0.6;
        }
    });

    let activeEntity = null;

    // Generate initial set of rooms ahead
    function generateInitialRooms() {
        roomsData = [];
        hidingSpots = [];
        doors = [];
        for (let i = 1; i <= 5; i++) {
            createRoomSegment(i);
        }
    }

    function createRoomSegment(index) {
        let rx = (index - 1) * roomLength;
        roomsData.push({ index: index, x: rx, isRed: index % 2 === 0 });

        // Add hiding spots (Lockers or Tables) inside the room
        hidingSpots.push({ x: rx + 250, type: "locker", highlighted: false });
        hidingSpots.push({ x: rx + 500, type: "table", highlighted: false });

        // Add a door at the end of the room
        doors.push({ x: rx + roomLength - 40, roomIndex: index, highlighted: false });
    }

    function startGame() {
        document.getElementById("menu-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function resetGameVars() {
        player.x = 100;
        player.stamina = 100;
        player.isHiding = false;
        currentRoomIndex = 1;
        cameraX = 0;
        activeEntity = null;
        generateInitialRooms();
    }

    function resetGame() {
        document.getElementById("gameover-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function triggerGameOver(reason) {
        gameState = "GAMEOVER";
        document.getElementById("death-reason").innerText = reason;
        document.getElementById("gameover-screen").style.display = "flex";
    }

    function tryInteractAction() {
        // Check lockers / tables first
        for (let spot of hidingSpots) {
            if (Math.abs(player.x - spot.x) < 50) {
                player.isHiding = !player.isHiding;
                if (player.isHiding) {
                    player.x = spot.x; 
                }
                return;
            }
        }

        // Check doors next
        for (let door of doors) {
            if (Math.abs(player.x - door.x) < 50) {
                doorSound.currentTime = 0;
                doorSound.play().catch(e => {});
                
                // Advance player forward through the door smoothly
                player.x += 80;
                currentRoomIndex = door.roomIndex + 1;

                // Infinite generation: if getting close to end, generate a new room ahead
                if (currentRoomIndex + 2 > roomsData.length) {
                    createRoomSegment(roomsData.length + 1);
                }
                return;
            }
        }
    }

    // Main Update Loop
    function update() {
        if (gameState !== "PLAYING") return;

        // --- STAMINA & MOVEMENT LOGIC ---
        let isRunning = keys['shift'] && player.stamina > 0 && (keys['a'] || keys['d']) && !player.isHiding;
        let currentSpeed = isRunning ? player.runSpeed : player.speed;

        if (isRunning) {
            player.stamina = Math.max(0, player.stamina - 0.8);
        } else if (!keys['shift'] && player.stamina < player.maxStamina) {
            player.stamina = Math.min(player.maxStamina, player.stamina + 0.4);
        }
        document.getElementById("stamina-fill").style.width = player.stamina + "%";

        if (!player.isHiding) {
            if (keys['a'] || keys['arrowleft']) {
                player.x -= currentSpeed;
            }
            if (keys['d'] || keys['arrowright']) {
                player.x += currentSpeed;
            }
        }

        player.x = Math.max(20, player.x);

        // Update Room Counter dynamically
        currentRoomIndex = Math.floor(player.x / roomLength) + 1;
        document.getElementById("room-counter").innerText = `Room: A-${String(currentRoomIndex).padStart(3, '0')}`;

        // Smooth Camera Follow Player
        let targetCameraX = player.x - canvas.width / 2;
        cameraX += (targetCameraX - cameraX) * 0.1;

        // --- HIGHLIGHT PROXIMITY CHECKS ---
        for (let spot of hidingSpots) {
            spot.highlighted = Math.abs(player.x - spot.x) < 50;
        }
        for (let door of doors) {
            door.highlighted = Math.abs(player.x - door.x) < 50;
        }

        // --- ENTITY SPAWN & AUDIO/AI LOGIC ---
        if (!activeEntity && Math.random() < 0.004 && currentRoomIndex > 2) {
            let template = entitiesConfig[Math.floor(Math.random() * entitiesConfig.length)];
            
            activeEntity = {
                name: template.name,
                type: template.type,
                speed: template.speed,
                image: template.loadedImage,
                x: cameraX + canvas.width + 100,
                state: "warning", 
                timer: 90 
            };

            if (template.sound) {
                template.sound.currentTime = 0;
                template.sound.play().catch(err => {});
            }
        }

        if (activeEntity) {
            if (activeEntity.state === "warning") {
                activeEntity.timer--;
                if (activeEntity.timer <= 0) {
                    activeEntity.state = "charging";
                }
            } else if (activeEntity.state === "charging") {
                activeEntity.x -= activeEntity.speed;

                if (Math.abs(player.x - activeEntity.x) < 40) {
                    if (!player.isHiding) {
                        triggerGameOver(`Killed by ${activeEntity.name}. You didn't hide in time!`);
                    }
                }

                if (activeEntity.x < cameraX - 100) {
                    activeEntity = null;
                }
            }
        }
    }

    // Main Render Loop
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        // --- DRAW INFINITE ROOMS WITH DEPTH & OUTLINES ---
        for (let room of roomsData) {
            let rx = room.x;

            // Walls (Green with depth gradient & outline)
            ctx.fillStyle = "#1e4d2b";
            ctx.fillRect(rx, 50, roomLength, 280);
            
            // Wall top shadow for depth
            ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
            ctx.fillRect(rx, 50, roomLength, 15);

            // Floors (Red or Blue with baseboard trim)
            ctx.fillStyle = room.isRed ? "#661111" : "#112266";
            ctx.fillRect(rx, 330, roomLength, 70);
            
            ctx.fillStyle = "#2c1d0c"; // Wooden baseboard trim
            ctx.fillRect(rx, 323, roomLength, 7);

            // Room Border Outlines
            ctx.strokeStyle = "#081c0e";
            ctx.lineWidth = 6;
            ctx.strokeRect(rx, 50, roomLength, 350);

            // Room Text Marker on back wall
            ctx.fillStyle = "#aaffaa";
            ctx.font = "16px 'Courier New'";
            ctx.fillText(`A-${String(room.index).padStart(3, '0')}`, rx + 50, 90);
        }

        // --- DRAW DOORS ---
        for (let door of doors) {
            // Door Frame & Panel
            ctx.fillStyle = "#331a00";
            ctx.fillRect(door.x - 20, 150, 40, 180);
            ctx.strokeStyle = "#110900";
            ctx.lineWidth = 3;
            ctx.strokeRect(door.x - 20, 150, 40, 180);

            // Door Knob
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.arc(door.x + 10, 240, 4, 0, Math.PI * 2);
            ctx.fill();

            // Door Prompt
            if (door.highlighted) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(door.x - 25, 145, 50, 190);

                ctx.fillStyle = "white";
                ctx.fillRect(door.x - 35, 110, 70, 25);
                ctx.fillStyle = "black";
                ctx.font = "bold 12px 'Courier New'";
                ctx.fillText("[E] DOOR", door.x - 30, 127);
            }
        }

        // --- DRAW REALISTIC LOCKERS & TABLES ---
        for (let spot of hidingSpots) {
            if (spot.type === "locker") {
                // Realistic Metallic Locker
                ctx.fillStyle = "#3a4a59";
                ctx.fillRect(spot.x - 22, 210, 44, 120);
                
                // Locker Outline
                ctx.strokeStyle = "#1a242c";
                ctx.lineWidth = 3;
                ctx.strokeRect(spot.x - 22, 210, 44, 120);

                // Locker Door Seam & Vent slots
                ctx.beginPath();
                ctx.moveTo(spot.x, 210);
                ctx.lineTo(spot.x, 330);
                ctx.stroke();

                ctx.fillStyle = "#1a242c";
                ctx.fillRect(spot.x - 15, 225, 8, 4);
                ctx.fillRect(spot.x - 15, 235, 8, 4);

                // Handle
                ctx.fillStyle = "#silver";
                ctx.fillRect(spot.x - 5, 270, 3, 20);
            } else {
                // Table
                ctx.fillStyle = "#734d26";
                ctx.fillRect(spot.x - 25, 270, 50, 60);
                ctx.strokeStyle = "#3b2613";
                ctx.lineWidth = 3;
                ctx.strokeRect(spot.x - 25, 270, 50, 60);
                // Table legs
                ctx.fillRect(spot.x - 20, 330, 6, 10);
                ctx.fillRect(spot.x + 14, 330, 6, 10);
            }

            // [E] HIDE Prompt
            if (spot.highlighted && !player.isHiding) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(spot.x - 27, 205, 54, 135);

                ctx.fillStyle = "white";
                ctx.fillRect(spot.x - 35, 175, 70, 25);
                ctx.fillStyle = "black";
                ctx.font = "bold 12px 'Courier New'";
                ctx.fillText("[E] HIDE", spot.x - 28, 192);
            }
        }

        // --- DRAW PLAYER (SOGGY CAT WITH OUTLINE) ---
        if (!player.isHiding) {
            if (soggyImg.complete && soggyImg.naturalHeight !== 0) {
                // Outer glow/outline effect box
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x - player.width / 2 - 1, player.y - 1, player.width + 2, player.height + 2);

                ctx.drawImage(soggyImg, player.x - player.width / 2, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(player.x - player.width / 2, player.y, player.width, player.height);
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x - player.width / 2, player.y, player.width, player.height);
            }
        }

        // --- DRAW ACTIVE ENTITY ---
        if (activeEntity) {
            if (activeEntity.state === "warning") {
                ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
                ctx.fillRect(cameraX, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 20px 'Courier New'";
                ctx.fillText(`⚠️ ${activeEntity.name} IS APPROACHING! FIND A LOCKER!`, cameraX + 120, 150);
            } else if (activeEntity.state === "charging") {
                if (activeEntity.image && activeEntity.image.complete && activeEntity.image.naturalHeight !== 0) {
                    ctx.drawImage(activeEntity.image, activeEntity.x - 30, player.y - 10, 60, 60);
                } else {
                    ctx.fillStyle = "#ff0055";
                    ctx.beginPath();
                    ctx.arc(activeEntity.x, player.y + 25, 25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
        }

        ctx.restore();
    }

    // Engine Loop
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
