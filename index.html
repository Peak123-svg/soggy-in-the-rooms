<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soggy Cat In The Rooms</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            box-shadow: none;
            border: none;
            border-radius: 0;
        }
        canvas {
            background: #111;
            display: block;
            width: 100%;
            height: 100%;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            border-radius: 0;
        }
        h1 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-size: 42px;
        }
        p {
            color: #aaaaaa;
            max-width: 700px;
            font-size: 18px;
            line-height: 1.5;
            font-weight: 400;
        }
        .btn {
            background-color: #ffffff;
            color: black;
            border: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 600;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
            border-radius: 0;
        }
        .btn:hover {
            background-color: #d1d1d1;
        }
        #ui-layer {
            position: absolute;
            top: 25px;
            left: 35px;
            right: 35px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 0.5px;
            z-index: 5;
        }
        .stamina-container {
            width: 220px;
            height: 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 0;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
            overflow: hidden;
        }
        #stamina-fill {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            transition: width 0.1s linear;
        }
        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 8;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="transition-overlay"></div>
    
    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <h1>SOGGY CAT IN THE ROOMS</h1>
        <p>help sog cat navigate through rooms. Use wasd/arrows to move, shift to run, space to jump, press e at lockers to hide, and press e at doors to progress.</p>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff5555;">YOU DIED</h1>
        <p id="death-reason">one of the evil sogs caughted u.</p>
        <button class="btn" onclick="resetGame()">TRY AGAIN</button>
    </div>

    <!-- HUD Elements -->
    <div id="ui-layer">
        <div id="room-counter">Room: A-001</div>
        <div>Stamina <div class="stamina-container"><div id="stamina-fill"></div></div></div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const soggyImg = new Image();
    soggyImg.crossOrigin = "anonymous";
    soggyImg.src = "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/soggy-removebg-preview.png";

    const doorSound = new Audio("https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/door_open.ogg");
    doorSound.volume = 0.6;

    let gameState = "MENU"; 

    let player = {
        x: 150,
        y: 0,
        width: 70,
        height: 85,
        speed: 5,
        runSpeed: 9,
        vy: 0,
        gravity: 0.7,
        jumpPower: -13,
        isGrounded: true,
        stamina: 100,
        maxStamina: 100,
        isHiding: false
    };

    let currentRoomIndex = 1;
    let cameraX = 0;
    let roomLength = 1100;  
    
    let roomsData = [];
    let hidingSpots = [];
    let doors = [];
    let activeEntities = [];
    let entitySpawnCooldown = 0;

    let keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ' && !keys['space_locked']) {
            keys['space_locked'] = true;
            if (gameState === "PLAYING" && player.isGrounded && !player.isHiding) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }
        }
        if (e.key.toLowerCase() === 'e' && gameState === "PLAYING") {
            tryInteractAction();
        }
    });
    window.addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false;
        if (e.key === ' ') {
            keys['space_locked'] = false;
        }
    });

    let entitiesConfig = [
        {
            name: "angry sog",
            type: "rusher",
            speed: 15,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/angy.jpg", 
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/Meow.wav"
        },
        {
            name: "evil sog",
            type: "rebounder",
            speed: 10,
            imageUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/soggy%20cat%20evil.webp",
            audioUrl: "https://raw.githubusercontent.com/Peak123-svg/soggy-in-the-rooms/main/Artful's%20Copyright%20Music%20Box%20(UNOFFICIAL%20UPLOAD).mp3"
        }
    ];

    entitiesConfig.forEach(config => {
        if (config.imageUrl) {
            let img = new Image();
            img.crossOrigin = "anonymous";
            img.src = config.imageUrl;
            config.loadedImage = img;
        }
        if (config.audioUrl) {
            config.sound = new Audio(config.audioUrl);
            config.sound.volume = 0.6;
            config.sound.loop = (config.type === "rebounder");
        }
    });

    function generateInitialRooms() {
        roomsData = [];
        hidingSpots = [];
        doors = [];
        for (let i = 1; i <= 6; i++) {
            createRoomSegment(i);
        }
    }

    function createRoomSegment(index) {
        let rx = (index - 1) * roomLength;
        roomsData.push({ index: index, x: rx });

        hidingSpots.push({ x: rx + 350, highlighted: false });
        hidingSpots.push({ x: rx + 750, highlighted: false });
        doors.push({ x: rx + roomLength - 60, roomIndex: index, highlighted: false });
    }

    function startGame() {
        document.getElementById("menu-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function resetGameVars() {
        player.x = 150;
        player.y = canvas.height - 250;
        player.vy = 0;
        player.isGrounded = true;
        player.stamina = 100;
        player.isHiding = false;
        currentRoomIndex = 1;
        cameraX = 0;
        entitySpawnCooldown = 0;
        
        entitiesConfig.forEach(c => {
            if (c.sound) {
                c.sound.pause();
                c.sound.currentTime = 0;
            }
        });
        activeEntities = [];
        generateInitialRooms();
    }

    function resetGame() {
        document.getElementById("gameover-screen").style.display = "none";
        gameState = "PLAYING";
        resetGameVars();
    }

    function triggerGameOver(reason) {
        gameState = "GAMEOVER";
        entitiesConfig.forEach(c => {
            if (c.sound) {
                c.sound.pause();
                c.sound.currentTime = 0;
            }
        });
        document.getElementById("death-reason").innerText = reason;
        document.getElementById("gameover-screen").style.display = "flex";
    }

    function tryInteractAction() {
        for (let spot of hidingSpots) {
            if (Math.abs(player.x - spot.x) < 80 && player.isGrounded) {
                player.isHiding = !player.isHiding;
                if (player.isHiding) {
                    player.x = spot.x; 
                    player.vy = 0;
                }
                return;
            }
        }

        for (let door of doors) {
            if (Math.abs(player.x - door.x) < 80) {
                doorSound.currentTime = 0;
                doorSound.play().catch(e => {});
                
                let overlay = document.getElementById("transition-overlay");
                overlay.style.opacity = "1";

                setTimeout(() => {
                    player.x += 120;
                    currentRoomIndex = door.roomIndex + 1;
                    document.getElementById("room-counter").innerText = `Room: A-${String(currentRoomIndex).padStart(3, '0')}`;

                    if (currentRoomIndex + 2 > roomsData.length) {
                        createRoomSegment(roomsData.length + 1);
                    }

                    if (entitySpawnCooldown > 0) {
                        entitySpawnCooldown--;
                    }

                    if (entitySpawnCooldown <= 0 && Math.random() < 0.6 && currentRoomIndex > 2) {
                        spawnEntity();
                        entitySpawnCooldown = 3; 
                    }

                    overlay.style.opacity = "0";
                }, 200);

                return;
            }
        }
    }

    function spawnEntity() {
        let template = entitiesConfig[Math.floor(Math.random() * entitiesConfig.length)];
        
        let newEntity = {
            name: template.name,
            type: template.type,
            speed: template.speed,
            image: template.loadedImage,
            x: cameraX + canvas.width + 150,
            state: "warning", 
            timer: 80,
            sound: template.sound,
            bouncesLeft: template.type === "rebounder" ? 2 : 0
        };

        activeEntities.push(newEntity);

        if (template.sound) {
            template.sound.currentTime = 0;
            template.sound.play().catch(err => {});
        }
    }

    function update() {
        if (gameState !== "PLAYING") return;

        let floorY = canvas.height - 200;

        let isRunning = keys['shift'] && player.stamina > 0 && (keys['a'] || keys['d']) && !player.isHiding;
        let currentSpeed = isRunning ? player.runSpeed : player.speed;

        if (isRunning) {
            player.stamina = Math.max(0, player.stamina - 0.8);
        } else if (!keys['shift'] && player.stamina < player.maxStamina) {
            player.stamina = Math.min(player.maxStamina, player.stamina + 0.4);
        }
        document.getElementById("stamina-fill").style.width = player.stamina + "%";

        if (!player.isHiding) {
            if (keys['a'] || keys['arrowleft']) {
                player.x -= currentSpeed;
            }
            if (keys['d'] || keys['arrowright']) {
                player.x += currentSpeed;
            }

            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= floorY - player.height) {
                player.y = floorY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }
        }

        let currentDoor = doors.find(d => d.roomIndex === currentRoomIndex);
        if (currentDoor && !player.isHiding) {
            let maxAllowedX = currentDoor.x - 30;
            if (player.x > maxAllowedX) {
                player.x = maxAllowedX;
            }
        }

        player.x = Math.max(40, player.x);

        let targetCameraX = player.x - canvas.width / 2;
        cameraX += (targetCameraX - cameraX) * 0.1;

        for (let spot of hidingSpots) {
            spot.highlighted = Math.abs(player.x - spot.x) < 80 && player.isGrounded;
        }
        for (let door of doors) {
            door.highlighted = Math.abs(player.x - door.x) < 80;
        }

        for (let i = activeEntities.length - 1; i >= 0; i--) {
            let ent = activeEntities[i];
            if (ent.state === "warning") {
                ent.timer--;
                if (ent.timer <= 0) {
                    ent.state = "charging";
                }
            } else if (ent.state === "charging") {
                ent.x -= ent.speed;

                // SPECIFICALLY DIE ONLY WHEN NOT HIDING
                if (Math.abs(player.x - ent.x) < 60) {
                    if (!player.isHiding) {
                        triggerGameOver(`Killed by ${ent.name}. You weren't hiding!`);
                    }
                }

                if (ent.type === "rebounder" && ent.x < cameraX - 250) {
                    if (ent.bouncesLeft > 0) {
                        ent.bouncesLeft--;
                        ent.speed *= -1; 
                    } else {
                        if (ent.sound) ent.sound.pause();
                        activeEntities.splice(i, 1);
                        continue;
                    }
                }

                if (ent.x < cameraX - 400 || ent.x > cameraX + canvas.width + 500) {
                    if (ent.sound) ent.sound.pause();
                    activeEntities.splice(i, 1);
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        let floorY = canvas.height - 200;
        let ceilingY = canvas.height - 620;
        let wallHeight = floorY - ceilingY;

        // --- DRAW ROOMS ---
        for (let room of roomsData) {
            let rx = room.x;

            // Solid grey walls
            ctx.fillStyle = "#252525";
            ctx.fillRect(rx, ceilingY, roomLength, wallHeight);

            // Solid Teal Floors
            ctx.fillStyle = "#14404c";
            ctx.fillRect(rx, floorY, roomLength, 250);
            
            ctx.fillStyle = "#0c2b33"; 
            ctx.fillRect(rx, floorY - 12, roomLength, 12);

            ctx.strokeStyle = "#080808";
            ctx.lineWidth = 8;
            ctx.strokeRect(rx, ceilingY, roomLength, wallHeight + 200);
        }

        // --- DRAW DOORS ---
        for (let door of doors) {
            let doorTop = floorY - 320;
            ctx.fillStyle = "#0c0602";
            ctx.fillRect(door.x - 36, doorTop - 8, 72, 328);

            let doorGrad = ctx.createLinearGradient(door.x - 32, doorTop, door.x + 32, floorY);
            doorGrad.addColorStop(0, "#593619");
            doorGrad.addColorStop(1, "#2b1708");
            ctx.fillStyle = doorGrad;
            ctx.fillRect(door.x - 32, doorTop, 64, 320);

            if (door.highlighted) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 3;
                ctx.strokeRect(door.x - 42, doorTop - 12, 84, 332);

                ctx.fillStyle = "white";
                ctx.fillRect(door.x - 52, doorTop - 60, 104, 38);
                ctx.fillStyle = "black";
                ctx.font = "bold 16px Arial";
                ctx.fillText("OPEN", door.x - 22, doorTop - 35);
            }
        }

        // --- DRAW LOCKERS ---
        for (let spot of hidingSpots) {
            let lockerTop = floorY - 220;
            let lockerGrad = ctx.createLinearGradient(spot.x - 35, lockerTop, spot.x + 35, floorY);
            lockerGrad.addColorStop(0, "#4a5d70");
            lockerGrad.addColorStop(1, "#222c36");
            ctx.fillStyle = lockerGrad;
            ctx.fillRect(spot.x - 35, lockerTop, 70, 220);

            if (spot.highlighted && !player.isHiding) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 3;
                ctx.strokeRect(spot.x - 40, lockerTop - 8, 80, 236);

                ctx.fillStyle = "white";
                ctx.fillRect(spot.x - 50, lockerTop - 55, 100, 38);
                ctx.fillStyle = "black";
                ctx.font = "bold 16px Arial";
                ctx.fillText("HIDE", spot.x - 20, lockerTop - 30);
            }
        }

        // --- DRAW PLAYER ---
        if (!player.isHiding) {
            if (soggyImg.complete && soggyImg.naturalHeight !== 0) {
                ctx.drawImage(soggyImg, player.x - player.width / 2, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(player.x - player.width / 2, player.y, player.width, player.height);
            }
        }

        // --- DRAW ACTIVE ENTITIES ---
        for (let ent of activeEntities) {
            if (ent.state === "charging") {
                if (ent.image && ent.image.complete && ent.image.naturalHeight !== 0) {
                    ctx.drawImage(ent.image, ent.x - 60, floorY - 170, 120, 120);
                } else {
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(ent.x - 45, floorY - 140, 90, 90);
                }
            }
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
